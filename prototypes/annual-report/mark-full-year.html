.month p{font-size:11.5px;line-height:1.48}.month .lead{font-size:15px}.month .quote{font-size:23px;margin:10px 0}.callout{padding:13px 16px;background:#e9f0ec;border-radius:12px;margin:13px 0}.callout strong{color:#346c69}.callout p{margin:5px 0 0}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:13px 0}.steps div{background:#f0f1ed;padding:10px;border-radius:9px;font-size:10px}.steps strong{display:block;color:#355c6b;margin-bottom:5px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:9px}.calendar div{text-align:center;border:1px solid #e3ded4;border-radius:5px;min-height:27px;padding:5px;font-size:10px}.calendar .dayhead{border:0;color:#80909a}.calendar .active{background:#dceae5;border-color:#8ab6a7}.calendar .review{background:#f5ead6;border-color:#d6b77d}.calendar .phase{background:#e6e6ec;border-color:#b9bccd}.legend{font-size:9px;color:var(--muted);margin-top:7px}.legend span{display:inline-block;padding-right:12px}.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;background:#8ab6a7}.legend .r i{background:#d6b77d}.legend .p i{background:#b9bccd}.footer-note{font-size:10px;color:var(--muted);border-top:1px solid var(--line);padding-top:11px;margin-top:15px}.month .footer-note{font-size:10px;line-height:1.35;padding-top:7px;margin-top:9px}

.year-list{display:grid;gap:6px;margin:18px 0}.year-list a{display:grid;grid-template-columns:28px 105px 1fr;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:5px 3px;text-decoration:none;color:var(--ink)}.year-list span{color:var(--gold);font-size:10px}.year-list b{font-size:11px}.year-list em{font-size:10px;color:var(--muted);font-style:normal}.aspect{background:#f1f2ed;border-left:2px solid var(--gold);padding:9px 12px;margin:13px 0;font-size:10px}.cal-title{font-size:24px;margin:13px 0 6px}.calendar.compact{gap:3px;margin-top:0}.calendar.compact div{min-height:23px;padding:3px}.calendar.compact small{color:var(--blue);padding-left:4px}.calendar .empty{border:0}.glossary{display:grid;gap:0}.glossary div{display:grid;grid-template-columns:120px 1fr;gap:15px;padding:12px 0;border-bottom:1px solid var(--line);font-size:11px}.glossary b{color:var(--blue)}.cta{background:#e8efed;border-radius:14px;padding:18px;margin-top:16px}.month .quote{font-size:21px;margin:12px 0}.month .lead{font-size:15px}.month p{font-size:12.6px;line-height:1.52}.month .callout{margin:10px 0;padding:10px 12px}.month .footer-note{font-size:8px}.controls{display:flex;gap:9px;align-items:center}.controls button{border:1px solid #d5b884;background:transparent;color:#fff;border-radius:7px;padding:6px 11px;font:11px Manrope,Arial;cursor:pointer}.controls button:hover{background:#ffffff20}.preview .premium{display:none}.lock{display:none}.preview .lock{display:block}.lock .soft{margin:20px auto;max-width:520px;text-align:center}.page.month{padding-top:17mm;padding-bottom:15mm}.page.month .num{bottom:9mm}@media(max-width:820px){.bar{flex-wrap:wrap;gap:6px}.controls{width:100%;justify-content:flex-end}.page.month{padding:42px 24px 68px}.year-list a{grid-template-columns:22px 90px 1fr}.month p{font-size:13px}.glossary div{grid-template-columns:1fr;gap:3px}}@media print{.controls,.lock{display:none!important}.preview .premium{display:block}.page.month{padding-top:17mm;padding-bottom:15mm}.month p{font-size:12.6px}.calendar.compact div{min-height:23px}}

<body><div class="bar"><b>Свой круг</b><span>Полный годовой разбор · Марк</span><div class="controls"><button onclick="document.body.classList.toggle('preview');this.textContent=document.body.classList.contains('preview')?'Показать полный отчёт':'Показать бесплатную часть'">Показать бесплатную часть</button><button onclick="window.print()">Сохранить PDF</button></div></div><main id="report"></main><section class="lock"><div class="soft"><h2>Продолжение закрыто</h2><p>В рабочей версии после покупки за 69 голосов откроются 12 месячных глав, годовая карта и справочник. Сейчас это только демонстрация границы доступа — оплаты здесь нет.</p><button onclick="document.body.classList.remove('preview');document.querySelector('.controls button').textContent='Показать бесплатную часть'">Открыть полное демо</button></div></section>
<script>
const positions=[['Солнце','Овен','18°44′',18.736220,'С'],['Луна','Стрелец','13°21′',253.346500,'Л'],['Меркурий','Телец','0°20′',30.326009,'Ме'],['Венера','Близнецы','4°23′',64.388505,'В'],['Марс','Овен','11°22′',11.366912,'Ма'],['Юпитер','Козерог','16°35′',286.589470,'Ю'],['Сатурн','Овен','0°07′',0.111711,'Са'],['Уран','Водолей','4°12′',304.197718,'У'],['Нептун','Козерог','27°38′',297.631741,'Н'],['Плутон','Стрелец','2°49′',242.809521,'П']];
function wheel(){
  const point=(longitude,r)=>{
    const a=(longitude-90)*Math.PI/180;
    return [250+r*Math.cos(a),250+r*Math.sin(a)];
  };
  let svg='<svg class="wheel" viewBox="0 0 500 500" role="img" aria-label="Карта рождения Марка: реальные долготы десяти планет, без домов"><circle cx="250" cy="250" r="224" fill="none" stroke="#bb9153" stroke-width="1.8"/><circle cx="250" cy="250" r="183" fill="none" stroke="#82949e"/><circle cx="250" cy="250" r="114" fill="none" stroke="#82949e"/>';
  for(let i=0;i<12;i++){
    const [x1,y1]=point(i*30,114),[x2,y2]=point(i*30,224);
    svg+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#9baab0"/>`;
  }
  const signs='ОВ ТЕ БЛ РА ЛЕ ДЕ ВЕ СК СТ КО ВД РЫ'.split(' ');
  signs.forEach((label,i)=>{
    const [x,y]=point(i*30+15,203);
    svg+=`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" fill="#ac8650" font-size="16" font-family="Arial">${label}</text>`;
  });
  const placed=[];
  [...positions].sort((a,b)=>a[3]-b[3]).forEach((body)=>{
    const [name,, ,lon,short]=body;
    const [sx,sy]=point(lon,114);
    let best=null;
    for(const r of [132,152,172]){
      const [x,y]=point(lon,r);
      const minDist=placed.length?Math.min(...placed.map(p=>Math.hypot(x-p[0],y-p[1]))):99;
      const score=minDist-(r-132)*0.06;
      if(!best||score>best.score)best={x,y,r,score};
      if(minDist>=25){best={x,y,r,score:100};break;}
    }
    placed.push([best.x,best.y]);
    svg+=`<line x1="${sx}" y1="${sy}" x2="${best.x}" y2="${best.y}" stroke="#657d88" stroke-width="1"/><circle cx="${sx}" cy="${sy}" r="2.5" fill="#bb9153"/><circle cx="${best.x}" cy="${best.y}" r="10.5" fill="#f7f2e8" stroke="#bb9153"/><title>${name}: ${body[2]} ${body[1]}</title><text x="${best.x}" y="${best.y+3.4}" text-anchor="middle" fill="#355c6b" font-size="8.5" font-family="Arial">${short}</text>`;
  });
  svg+='<text x="250" y="242" text-anchor="middle" font-size="30" font-family="Georgia" fill="#355c6b">Марк</text><text x="250" y="265" text-anchor="middle" font-size="11" font-family="Arial" fill="#87929a">08.04.1996 · 07:13 UTC</text></svg>';
  return svg;
}
function page(n,cls,content){return `<section class="page ${cls||''}">${content}<div class="num">СВОЙ КРУГ · ${String(n).padStart(2,'0')}</div></section>`}
let h='';
h+=page(1,'cover',`<div class="eyebrow">Персональный атлас · пилот</div><div class="intro"><span class="pill">Реальные астрономические положения</span><h1>Марк,<br>ваш год<br>в орбите</h1><p class="lead">Первый проверочный выпуск: ваша карта рождения и подробный разбор ноября 2026 года.</p></div><div class="orb"><div><span>✦</span><small>08 АПРЕЛЯ 1996<br>ЧЕРЕПОВЕЦ · 11:13</small></div></div><footer>Ноябрь 2026 — октябрь 2027 · пока готова первая глава</footer>`);
h+=page(2,'',`<div class="eyebrow">01 · Исходные данные</div><h2>Карта рождения</h2><div class="rule"></div><p class="lead">Место рождения: Череповец (59.1269° с. ш., 37.9092° в. д.). 8 апреля 1996 года действовало летнее время UTC+4, поэтому 11:13 на местных часах — это 07:13 UTC.</p><div class="data"><div><small>Солнце</small><strong>Овен</strong><small>18°44′</small></div><div><small>Луна</small><strong>Стрелец</strong><small>13°21′</small></div><div><small>Асцендент*</small><strong>Рак</strong><small>≈ 22°33′</small></div></div>${wheel()}<div class="positions">${positions.map(x=>`<div><b>${x[0]}</b><span>${x[2]} ${x[1]}</span></div>`).join('')}</div><p class="footer-note">* Асцендент пока рассчитан отдельно по сидерическому времени и требует независимой проверки с выбранной системой домов. Планеты рассчитаны по тропической геоцентрической долготе; округление до минуты дуги.</p>`);
h+=page(3,'',`<div class="eyebrow">02 · Главная нить года</div><h2>Три касания к одной теме</h2><div class="rule"></div><p class="lead">В вашей карте Венера стоит около 4°23′ Близнецов. В 2026–2027 годах Уран проходит эту точку трижды — прямым ходом, обратным и снова прямым. Для годового отчёта это гораздо содержательнее случайной фразы «перемены в любви».</p><div class="arc"><div><small>Первое касание</small><strong>15 июля<br>2026</strong><p>Знакомство с темой. Что в отношениях, творчестве или способе обмена уже перестало устраивать?</p></div><div><small>Повторный проход</small><strong>8 ноября<br>2026</strong><p>Ноябрь возвращает вопрос. Можно отделить временное раздражение от устойчивой потребности изменить правила.</p></div><div><small>Третье касание</small><strong>3 мая<br>2027</strong><p>Возможность сравнить намерения с практикой и выбрать форму, которую действительно хочется сохранить.</p></div></div><div class="note"><strong>Это трактовка, а не предсказание события.</strong> Венера в западной астрологии связана с ценностями, симпатиями и обменом; Уран — с обновлением и свободой. Точное соединение говорит лишь о совпадении долгот, а не гарантирует знакомство, разрыв или прибыль.</div><h3 style="margin-top:27px">На чём основан ноябрь</h3><div class="basis"><b>1 ноября</b><span>Транзитный Марс образует тригон к вашему Солнцу (точный аспект около 08:28 по Москве).</span></div><div class="basis"><b>8 ноября</b><span>Транзитный Уран повторно соединяется с вашей Венерой (около 16:59 по Москве).</span></div><div class="basis"><b>22 ноября</b><span>Транзитное Солнце образует тригон к вашему Сатурну (около 13:03 по Москве).</span></div><p class="footer-note">Время аспектов округлено до минуты. Без подтверждённой системы домов мы не приписываем этим аспектам конкретную сферу жизни как астрономический факт.</p>`);

h=h.replace('Первый проверочный выпуск: ваша карта рождения и подробный разбор ноября 2026 года.','Полный персональный годовой атлас: карта рождения, 12 разных глав и календарные ориентиры на каждый месяц.')
 .replace('пока готова первая глава','полный демо-выпуск · 18 страниц')
 .replace('Пилот персонального разбора · Марк','Полный годовой разбор · Марк');
h+=page(4,'premium',`<div class="eyebrow">03 · Как читать атлас</div><h2>Карта, метод, границы</h2><div class="rule"></div><p class="lead">Перед месячными главами — честное описание того, что посчитано, а что является толкованием.</p><div class="grid2"><div class="soft"><span class="caps">Исходные данные</span><h3>08.04.1996</h3><p>11:13 в Череповце. Историческое летнее время UTC+4; момент рождения 07:13 UTC. Координаты: 59.1269° N, 37.9092° E. Ошибка времени рождения способна существенно изменить восходящий градус и дома.</p></div><div class="soft"><span class="caps">Основа расчёта</span><h3>Тропический зодиак</h3><p>Геоцентрические эклиптические долготы планет и моменты точных аспектов рассчитаны астрономической библиотекой. Символические значения аспектов — редакционная интерпретация, не подтверждённое предсказание событий.</p></div></div><div class="line"></div><h3>Что включено</h3><div class="basis"><b>10 тел</b><span>Солнце, Луна и восемь планет с положениями при рождении. В колесе они стоят на рассчитанных долготах, а не на нарисованных «для красоты» местах.</span></div><div class="basis"><b>12 месяцев</b><span>Ноябрь 2026 — октябрь 2027: своя тема, личные точные аспекты, календарь и вопрос для рефлексии на каждый месяц.</span></div><div class="basis"><b>Без домов</b><span>Асцендент предварительно около 22°33′ Рака; сектора домов намеренно не нанесены до независимой проверки метода и расчёта. Мы не выдаём неподтверждённые дома за факт.</span></div><div class="note" style="margin-top:22px"><strong>Важное ограничение.</strong> Астрономия определяет положение небесных тел; она не доказывает способность астрологии предсказывать любовь, доход, здоровье или события. Читайте текст как инструмент размышления, а не замену личным решениям и профильным советам.</div><p class="footer-note">Демонстрация формата. Календарные дни — локальные даты Москвы (UTC+3); точные моменты аспектов округлены. При работе с реальным продуктом нужны версионирование расчётов, тесты часовых поясов и независимая проверка эфемерид.</p>`);
h+=page(5,'premium',`<div class="eyebrow">04 · Год на одном развороте</div><h2>Двенадцать орбит</h2><div class="rule"></div><p class="lead">Не оценка «удачи», а маршрут тем. Нажмите на месяц в HTML, чтобы перейти к главе; в PDF это разворот для ориентира.</p><div class="year-list"><a href="#month-1"><span>01</span><b>Ноябрь 2026</b><em>Пересмотреть условия, сохранив ценное</em></a><a href="#month-2"><span>02</span><b>Декабрь 2026</b><em>Проверить импульс на прочность</em></a><a href="#month-3"><span>03</span><b>Январь 2027</b><em>Выбрать глубину вместо спектакля перемен</em></a><a href="#month-4"><span>04</span><b>Февраль 2027</b><em>Превратить напряжение в структуру</em></a><a href="#month-5"><span>05</span><b>Март 2027</b><em>Согласовать надежду с ресурсами</em></a><a href="#month-6"><span>06</span><b>Апрель 2027</b><em>Определить свою меру ответственности</em></a><a href="#month-7"><span>07</span><b>Май 2027</b><em>Закрепить итог трёх касаний</em></a><a href="#month-8"><span>08</span><b>Июнь 2027</b><em>Проверить пользу выбранного масштаба</em></a><a href="#month-9"><span>09</span><b>Июль 2027</b><em>Отделить сопротивление от ограничения</em></a><a href="#month-10"><span>10</span><b>Август 2027</b><em>Не отвечать скоростью на каждый вызов</em></a><a href="#month-11"><span>11</span><b>Сентябрь 2027</b><em>Дать чувствам место, не делая их приговором</em></a><a href="#month-12"><span>12</span><b>Октябрь 2027</b><em>Собрать год в понятную следующую главу</em></a></div><div class="quote">Три опорные точки года: пересмотр ценного, проверка ресурсов, выбор устойчивой формы.</div><div class="grid2"><div class="soft"><span class="caps">Повторяющийся сюжет</span><p>Уран — Венера: июль 2026 → ноябрь 2026 → май 2027. Это точные касания одной и той же натальной точки, поэтому они связывают разные месяцы в одну историю.</p></div><div class="soft"><span class="caps">Проверка масштаба</span><p>Февраль–апрель: Сатурн касается Марса и Солнца; март и май: Юпитер дважды формирует тригон к Солнцу. Возможность расширения проверяется реальным ресурсом.</p></div></div><p class="footer-note">Навигация и формулировки внутри отчёта демонстрационные. Индивидуальное значение каждого аспекта зависит от контекста жизни, который нельзя вывести из даты рождения.</p>`);
h+=page(6,'premium month',`<div id="month-1" class="eyebrow">05 · Месяц 01 / 12</div><h2>Ноябрь 2026</h2><div class="rule"></div><span class="pill">Пересмотреть условия, сохранив ценное</span><p class="lead" style="margin-top:17px">Второй проход Урана через вашу натальную Венеру возвращает вопрос, обозначившийся в июле: какая свобода нужна вам в отношениях, сотрудничестве или обращении с собственным временем?</p><div class="aspect"><strong>Основание главы</strong><br>8 ноября · Уран соединяется с вашей Венерой. 1 ноября · Марс в тригоне к Солнцу. 22 ноября · Солнце в тригоне к Сатурну.</div><p>Натальная Венера у вас в Близнецах, поэтому разговор, выбор и обмен идеями — естественный язык этой символической темы. Если в одной из связей накопилось ощущение тесноты, не спешите делать из него вывод о человеке. Попробуйте точнее назвать правило, которое устарело: график, ожидание постоянной доступности, способ принимать решения или финансовое условие. Карта не показывает, в какой именно сфере это проявится; эту часть нужно проверять по вашей жизни.</p><p>В начале месяца тригон Марса к Солнцу может быть хорошим поводом для небольшого эксперимента: предложить встречу, новый формат или пробный срок. Важнее обратимость шага, чем громкость заявления. На точном касании Урана 8 ноября полезно записать, что изменилось после лета и чего вы теперь хотите. К 22 ноября попробуйте оформить договорённость в конкретные сроки и критерии, не оставляя всё на уровне намёков.</p><div class="callout"><strong>Попробуйте на практике</strong><p>Составьте две колонки: «что я хочу сохранить» и «какое правило хочу обновить». Из второй колонки выберите одно изменение, о котором можно поговорить прямо.</p></div><div class="quote">Как попросить больше свободы, не обесценивая то, что мне дорого?</div><h3 class="cal-title">Календарь месяца</h3><div class="calendar compact"><div class="dayhead">Пн</div><div class="dayhead">Вт</div><div class="dayhead">Ср</div><div class="dayhead">Чт</div><div class="dayhead">Пт</div><div class="dayhead">Сб</div><div class="dayhead">Вс</div><div class="empty"></div><div class="empty"></div><div class="empty"></div><div class="empty"></div><div class="empty"></div><div class="empty"></div><div class="active">1<small>✦</small></div><div class="">2</div><div class="">3</div><div class="">4</div><div class="">5</div><div class="">6</div><div class="">7</div><div class="active">8<small>✦</small></div><div class="phase">9</div><div class="">10</div><div class="">11</div><div class="">12</div><div class="">13</div><div class="">14</div><div class="">15</div><div class="">16</div><div class="">17</div><div class="">18</div><div class="">19</div><div class="">20</div><div class="">21</div><div class="active">22<small>✦</small></div><div class="">23</div><div class="phase">24</div><div class="">25</div><div class="">26</div><div class="">27</div><div class="">28</div><div class="">29</div><div class="">30</div></div><div class="legend"><span><i></i>точный личный аспект</span><span class="p"><i></i>фаза Луны — общий ритм</span></div><p class="footer-note">Подсветка не означает гарантированно удачный или неблагоприятный день. Лунные даты и аспекты округлены до московской календарной даты; решения сверяйте с реальными условиями.</p>`);
h+=page(7,'premium month',`<div id="month-2" class="eyebrow">05 · Месяц 02 / 12</div><h2>Декабрь 2026</h2><div class="rule"></div><span class="pill">Проверить импульс на прочность</span><p class="lead" style="margin-top:17px">После ноябрьского пересмотра становится заметно, какие желания выдерживают контакт с реальными договорённостями, а какие были реакцией на усталость.</p><div class="aspect"><strong>Основание главы</strong><br>8 декабря · Марс образует квадрат к вашей Венере. К началу января Плутон приближается к точному тригону с Венерой.</div><p>Квадрат Марса и вашей Венеры в начале декабря в астрологической интерпретации описывает трение между действием и тем, что вы цените. Это не указание на ссору. В практическом смысле стоит заметить, где вы говорите «да» из вежливости, а потом злитесь на собственное согласие. В вопросах покупок и совместных затрат пригодится пауза перед обязательством: назовите сумму, срок и то, кто за что отвечает.</p><p>Одновременно более медленный Плутон идёт к гармоничному аспекту с Венерой, который станет точным 2 января. Это задаёт вторую, менее шумную линию: не просто поменять условия на неделю, а понять, почему прежняя схема так долго сохранялась. Если в декабре разговор повторится, сравните его с ноябрьскими записями. Повторяемость часто полезнее любого «удачного дня»: она показывает, что речь идёт не о случайном настроении.</p><div class="callout"><strong>Попробуйте на практике</strong><p>Перед важным согласием сделайте письменную проверку: что я отдаю, что получаю, могу ли отказаться без ущерба и когда пересматриваем условия?</p></div><div class="quote">Где я защищаю привычное удобство вместо действительно важной для меня ценности?</div><h3 class="cal-title">Календарь месяца</h3><div class="calendar compact"><div class="dayhead">Пн</div><div class="dayhead">Вт</div><div class="dayhead">Ср</div><div class="dayhead">Чт</div><div class="dayhead">Пт</div><div class="dayhead">Сб</div><div class="dayhead">Вс</div><div class="empty"></div><div class="">1</div><div class="">2</div><div class="">3</div><div class="">4</div><div class="">5</div><div class="">6</div><div class="">7</div><div class="active">8<small>✦</small></div><div class="phase">9</div><div class="">10</div><div class="">11</div><div class="">12</div><div class="">13</div><div class="">14</div><div class="">15</div><div class="">16</div><div class="">17</div><div class="">18</div><div class="">19</div><div class="">20</div><div class="">21</div><div class="">22</div><div class="">23</div><div class="phase">24</div><div class="">25</div><div class="">26</div><div class="">27</div><div class="">28</div><div class="">29</div><div class="">30</div><div class="">31</div></div><div class="legend"><span><i></i>точный личный аспект</span><span class="p"><i></i>фаза Луны — общий ритм</span></div><p class="footer-note">Подсветка не означает гарантированно удачный или неблагоприятный день. Лунные даты и аспекты округлены до московской календарной даты; решения сверяйте с реальными условиями.</p>`);
h+=page(8,'premium month',`<div id="month-3" class="eyebrow">05 · Месяц 03 / 12</div><h2>Январь 2027</h2><div class="rule"></div><span class="pill">Выбрать глубину вместо спектакля перемен</span><p class="lead" style="margin-top:17px">Январь предлагает взглянуть на ценность связи или проекта не по яркости впечатления, а по тому, что вы готовы поддерживать на длинной дистанции.</p><div class="aspect"><strong>Основание главы</strong><br>2 января · Плутон образует точный тригон к вашей натальной Венере. Весь месяц продолжается длительная тема Урана и Венеры.</div><p>Тригон Плутона к Венере — символический язык для глубокой ревизии привязанностей, ресурсов и привычек обмена. Он не обещает «судьбоносной встречи» и не обязывает к разрыву. Полезнее спросить: какую роль играют контроль, страх потери и желание понравиться в ваших решениях? Если ответ получается неудобным, это не диагноз. Это тема для внимательного разговора и наблюдения.</p><p>На фоне уранической линии года легко спутать движение с прогрессом. Можно резко изменить форму сотрудничества и обнаружить, что старая проблема осталась. В январе попробуйте выбрать одно устойчивое правило: как вы обсуждаете деньги, распределяете время или сигнализируете о перегрузке. Сравните его с тем, что записали в ноябре. Если нового правила никто не может соблюдать, его стоит упростить, а не объявлять провалом.</p><div class="callout"><strong>Попробуйте на практике</strong><p>Выберите один повторяющийся разговор и сформулируйте его без обвинений: факт, ваше ощущение, конкретная просьба, дата обратной связи.</p></div><div class="quote">Что для меня по-настоящему ценно, даже если это не выглядит эффектно со стороны?</div><h3 class="cal-title">Календарь месяца</h3><div class="calendar compact"><div class="dayhead">Пн</div><div class="dayhead">Вт</div><div class="dayhead">Ср</div><div class="dayhead">Чт</div><div class="dayhead">Пт</div><div class="dayhead">Сб</div><div class="dayhead">Вс</div><div class="empty"></div><div class="empty"></div><div class="empty"></div><div class="empty"></div><div class="">1</div><div class="active">2<small>✦</small></div><div class="">3</div><div class="">4</div><div class="">5</div><div class="">6</div><div class="phase">7</div><div class="">8</div><div class="">9</div><div class="">10</div><div class="">11</div><div class="">12</div><div class="">13</div><div class="">14</div><div class="">15</div><div class="">16</div><div class="">17</div><div class="">18</div><div class="">19</div><div class="">20</div><div class="">21</div><div class="phase">22</div><div class="">23</div><div class="">24</div><div class="">25</div><div class="">26</div><div class="">27</div><div class="">28</div><div class="">29</div><div class="">30</div><div class="">31</div></div><div class="legend"><span><i></i>точный личный аспект</span><span class="p"><i></i>фаза Луны — общий ритм</span></div><p class="footer-note">Подсветка не означает гарантированно удачный или неблагоприятный день. Лунные даты и аспекты округлены до московской календарной даты; решения сверяйте с реальными условиями.</p>`);
h+=page(9,'premium month',`<div id="month-4" class="eyebrow">05 · Месяц 04 / 12</div><h2>Февраль 2027</h2><div class="rule"></div><span class="pill">Превратить напряжение в структуру</span><p class="lead" style="margin-top:17px">Месяц соединяет раздражитель и дисциплину: не всякий импульс требует немедленного выхода, но некоторые вопросы уже пора перевести в расписание и обязанности.</p><div class="aspect"><strong>Основание главы</strong><br>10 февраля · Марс в квадрате к Венере. 13 февраля · Сатурн соединяется с натальным Марсом. 20 февраля · Марс в тригоне к Меркурию.</div><p>Повторный квадрат Марса к Венере напоминает декабрьский сюжет. Если похожая тема снова всплывает, посмотрите, изменилось ли поведение после первого разговора. Сатурн на вашем натальном Марсе — более редкая и длительная точка. В трактовке она связана с ограничениями, выносливостью и необходимостью выбирать, на что тратить усилия. Не стоит превращать её в обещание препятствий: ограничения могут быть как внешними, так и разумно установленными вами.</p><p>Практически февраль хорош для инвентаризации нагрузки. Назовите одно обязательство, которое поглощает силы без ясного результата, и решите, оставить его, делегировать или ограничить срок. Тригон Марса к Меркурию около 20 февраля даёт редакционный повод обсудить уже подготовленный план. Лучше прийти к разговору с цифрами и вариантами, чем рассчитывать, что собеседник сам угадает степень вашей усталости.</p><div class="callout"><strong>Попробуйте на практике</strong><p>Сделайте карту нагрузки: три главных обязательства, цена каждого в часах, признак завершения. Уберите хотя бы одну неопределённость.</p></div><div class="quote">Где моя настойчивость помогает делу, а где поддерживает неработающую схему?</div><h3 class="cal-title">Календарь месяца</h3><div class="calendar compact"><div class="dayhead">Пн</div><div class="dayhead">Вт</div><div class="dayhead">Ср</div><div class="dayhead">Чт</div><div class="dayhead">Пт</div><div class="dayhead">Сб</div><div class="dayhead">Вс</div><div class="">1</div><div class="">2</div><div class="">3</div><div class="">4</div><div class="">5</div><div class="phase">6</div><div class="">7</div><div class="">8</div><div class="">9</div><div class="active">10<small>✦</small></div><div class="">11</div><div class="">12</div><div class="active">13<small>✦</small></div><div class="">14</div><div class="">15</div><div class="">16</div><div class="">17</div><div class="">18</div><div class="">19</div><div class="active">20<small>✦</small></div><div class="phase">21</div><div class="">22</div><div class="">23</div><div class="">24</div><div class="">25</div><div class="">26</div><div class="">27</div><div class="">28</div></div><div class="legend"><span><i></i>точный личный аспект</span><span class="p"><i></i>фаза Луны — общий ритм</span></div><p class="footer-note">Подсветка не означает гарантированно удачный или неблагоприятный день. Лунные даты и аспекты округлены до московской календарной даты; решения сверяйте с реальными условиями.</p>`);
h+=page(10,'premium month',`<div id="month-5" class="eyebrow">05 · Месяц 05 / 12</div><h2>Март 2027</h2><div class="rule"></div><span class="pill">Согласовать надежду с ресурсами</span><p class="lead" style="margin-top:17px">В марте рядом стоят желание расшириться и необходимость посчитать цену расширения. Это не конфликт «хороших» и «плохих» планет, а проверка масштаба.</p><div class="aspect"><strong>Основание главы</strong><br>3 марта · Сатурн в тригоне к Луне. 10 марта · Юпитер в тригоне к Солнцу. 30 марта · Сатурн в квадрате к Юпитеру.</div><p>Ваша Луна в Стрельце символически любит горизонт, смысл и возможность движения. Тригон Сатурна к Луне в начале месяца можно прочитать как шанс дать этим потребностям устойчивую опору: регулярность, честный бюджет, договор о свободном времени. Тригон Юпитера к Солнцу вскоре после этого добавляет настроение замаха. Данные показывают точные аспекты; идея о настроении — уже интерпретация, которую важно сверять с реальными обстоятельствами.</p><p>К концу месяца квадрат Сатурна к натальному Юпитеру предлагает контрольный вопрос: есть ли у новой идеи ресурсы, сроки и предел потерь? Не обязательно отказываться от большого плана. Разбейте его на этапы и решите заранее, по каким признакам продолжите. Если воодушевление марта переживёт проверку цифрами и первым маленьким результатом, проект станет более вашим, а не просто привлекательным образом будущего.</p><div class="callout"><strong>Попробуйте на практике</strong><p>Для одной идеи запишите три сценария: минимальный запуск, комфортный масштаб и стоп-условие. Обсудите их до вложения больших ресурсов.</p></div><div class="quote">Какой рост мне доступен без долга перед собственными силами?</div><h3 class="cal-title">Календарь месяца</h3><div class="calendar compact"><div class="dayhead">Пн</div><div class="dayhead">Вт</div><div class="dayhead">Ср</div><div class="dayhead">Чт</div><div class="dayhead">Пт</div><div class="dayhead">Сб</div><div class="dayhead">Вс</div><div class="">1</d h+=page(11,'premium month',`<div id="month-6" class="eyebrow">05 · Месяц 06 / 12</div><h2>Апрель 2027</h2><div class="rule"></div><span class="pill">Определить свою меру ответственности</span><p class="lead" style="margin-top:17px">Это один из самых содержательных месяцев годовой дуги: мягкая тема вдохновения соседствует с требованием яснее определить границы личной ответственности.</p><div class="aspect"><strong>Основание главы</strong><br>2 апреля · Нептун в секстиле к Венере. 16 апреля · Сатурн соединяется с натальным Солнцем.</div><p>Секстиль Нептуна к Венере может дать материал для творчества, эмпатии и тонкого разговора о близости. Но символический язык Нептуна имеет и оборотную сторону — красивый образ легче принять за договор. Поэтому любую эмоционально важную идею стоит перевести в вопрос «что именно мы делаем?» и «как поймём, что получилось?». Это особенно полезно там, где деньги или ожидания сторон смешиваются с симпатией.</p><p>Соединение Сатурна с вашим Солнцем около 16 апреля — долгий маркер структуры и зрелого выбора. Не нужно читать его как «тяжёлый период» без контекста. Он может означать решимость сократить лишнее и вложиться в одно направление. Оцените, какие роли вы несёте потому, что действительно выбрали их, а какие — по инерции. Чем меньше туманности в обязательствах, тем легче заметить, на что у вас остаются силы.</p><div class="callout"><strong>Попробуйте на практике</strong><p>Напишите короткий список обязательств на три месяца: что принимаю, что откладываю, от чего отказываюсь. Сверьте с календарём.</p></div><div class="quote">Какая ответственность делает меня сильнее, а какая только делает меня удобным?</div><h3 class="cal-title">Календарь месяца</h3><div class="calendar compact"><div class="dayhead">Пн</div><div class="dayhead">Вт</div><div class="dayhead">Ср</div><div class="dayhead">Чт</div><div class="dayhead">Пт</div><div class="dayhead">Сб</div><div class="dayhead">Вс</div><div class="empty"></div><div class="empty"></div><div class h+=page(12,'premium month',`<div id="month-7" class="eyebrow">05 · Месяц 07 / 12</div><h2>Май 2027</h2><div class="rule"></div><span class="pill">Закрепить итог трёх касаний</span><p class="lead" style="margin-top:17px">Май завершает сюжет, начавшийся прошлым летом: не обязательно получить готовый ответ, но уже можно увидеть, какие способы быть вместе и работать рядом стали жизнеспособными.</p><div class="aspect"><strong>Основание главы</strong><br>3 мая · третье соединение Урана с Венерой. 15 мая · Марс в тригоне к Меркурию. 17 мая · повторный тригон Юпитера к Солнцу. 25 мая · Марс в квадрате к Венере.</div><p>Третье точное касание Урана к Венере — повод сравнить три снимка: июль 2026, ноябрь 2026 и сейчас. Что менялось в желаниях, что — в условиях, а что осталось неизменным? Не превращайте этот транзит в обещание обязательного финала. Завершиться может не связь, а прежний способ договариваться. Для отчёта это важная разница: именно она помогает читать астрологический символ без драматизации.</p><p>Середина месяца сочетает аспект Марса к Меркурию и повторный тригон Юпитера к Солнцу. Если у вас есть продуманный проект или разговор, обозначьте позицию ясно и попросите конкретный ответ. К 25 мая очередной квадрат Марса к Венере покажет, выдерживают ли новые правила живое раздражение и разницу интересов. Это проверка качества соглашения, а не «неудачный день». Рабочая договорённость допускает корректировки и не требует угадывания.</p><div class="callout"><strong>Попробуйте на практике</strong><p>Сделайте ревизию «было — стало — остаётся открытым» для главной темы года. Последнему пункту назначьте следующую дату разговора.</p></div><div class="quote">Какие перемены выдержали повседневность, а какие существовали только как обещание?</div><h3 class="cal-title">Календарь месяца</h3><div class="calendar compact"><div class="dayhead">Пн</div><div class="dayhead">Вт</div><div class="dayhead">Ср</div><div class="dayhead">Чт</div><div class="dayhead">Пт</div><div class="dayhead h+=page(15,'premium month',`<div id="month-10" class="eyebrow">05 · Месяц 10 / 12</div><h2>Август 2027</h2><div class="rule"></div><span class="pill">Не отвечать скоростью на каждый вызов</span><p class="lead" style="margin-top:17px">В августе несколько аспектов подряд акцентируют темп, амбицию и цену желаемого. Хороший момент проверить, где энергия действительно служит цели.</p><div class="aspect"><strong>Основание главы</strong><br>3 августа · Марс в оппозиции к натальному Марсу. 15 августа · Марс в оппозиции к Солнцу. 16 августа · Юпитер в квадрате к Венере.</div><p>Две оппозиции Марса в первой половине месяца символически похожи на встречу с внешним сопротивлением или собственным пределом скорости. Это не основание ожидать конфликт или травму. Практический вывод мягче: не назначайте себе обязательств только потому, что сейчас много энергии. Спросите, что будет с этим планом через четыре недели и кто поможет, если он окажется труднее ожидаемого.</p><p>Квадрат Юпитера к вашей Венере около 16 августа добавляет тему масштаба желания. Можно хотеть большего внимания, комфорта, свободы или вложений; всё это человеческие потребности. Но чем привлекательнее предложение, тем важнее увидеть полную стоимость. В личных отношениях это цена временем и ясностью обещаний, в проекте — деньгами и ответственностью. Если хочется резкого решения, полезно отложить подпись и ещё раз перечитать условия в спокойном состоянии.</p><div class="callout"><strong>Попробуйте на практике</strong><p>Перед крупным обещанием задайте три вопроса: что я реально беру на себя, чего не вижу в цене, как выйду из договорённости?</p></div><div class="quote">Где я выбираю больше, хотя на самом деле мне нужно точнее?</div><h3 class="cal-title">Календарь месяца</h3><div class="calendar compact"><div class="dayhead">Пн</div><div class="dayhead">Вт</div><div class="dayhead">Ср</div><div class="dayhead">Чт</div><div class="dayhead">Пт</div><div class="dayhead">Сб</div><div class="dayhead">Вс</div><div class="emp h+=page(16,'premium month',`<div id="month-11" class="eyebrow">05 · Месяц 11 / 12</div><h2>Сентябрь 2027</h2><div class="rule"></div><span class="pill">Дать чувствам место, не делая их приговором</span><p class="lead" style="margin-top:17px">Сентябрь выводит на первый план вопрос эмоционального масштаба: что действительно подпитывает вас, а что только обещает мгновенное облегчение?</p><div class="aspect"><strong>Основание главы</strong><br>26 сентября · Юпитер образует квадрат к вашей натальной Луне. 16 сентября · полнолуние; 30 сентября · новолуние.</div><p>Натальная Луна у вас в Стрельце; в астрологической символике ей важно видеть смысл и перспективу. Квадрат Юпитера к Луне ближе к концу месяца можно читать как желание расширить пространство для себя. Но аспект не сообщает, чего именно вам недостаёт. Это может быть отдых, обучение, новый проект или просто честное признание перегрузки. Вместо поспешного объяснения попробуйте описать ощущение без диагноза и без поиска виноватого.</p><p>В календаре этого месяца мало точных персональных точек по выбранным планетам. Поэтому не стоит заполнять пустоту искусственными «удачными датами». Фазы Луны отмечены как общий ритм, а не персональное обещание. Если август требовал проверки цены выбора, сентябрь подходит для проверки его эмоциональных последствий: стало ли больше воздуха, ясности и интереса? Если нет, возможно, нужно не новое крупное решение, а корректировка повседневного режима.</p><div class="callout"><strong>Попробуйте на практике</strong><p>Неделю отмечайте три вещи: что забрало силы, что вернуло интерес, о чём вы просили прямо. По итогам выберите одну поправку.</p></div><div class="quote">Я ищу расширения возможностей или бегу от давно названной потребности?</div><h3 class="cal-title">Календарь месяца</h3><div class="calendar compact"><div class="dayhead">Пн</div><div class="dayhead">Вт</div><div class="dayhead">Ср</div><div class="dayhead">Чт</div><div class="dayhead">Пт</div><div class="dayhead">Сб</div><div c h+=page(17,'premium month',`<div id="month-12" class="eyebrow">05 · Месяц 12 / 12</div><h2>Октябрь 2027</h2><div class="rule"></div><span class="pill">Собрать год в понятную следующую главу</span><p class="lead" style="margin-top:17px">Финал отчётного года не обязан выглядеть как грандиозная развязка. Его ценность — в возможности увидеть, какие решения стали устойчивыми и какой горизонт теперь действительно ваш.</p><div class="aspect"><strong>Основание главы</strong><br>12 октября · Юпитер в тригоне к натальному Юпитеру. 31 октября · Нептун повторно в секстиле к натальной Венере.</div><p>Тригон Юпитера к самому себе в астрологической трактовке подходит для разговора о росте: не о том, что «повезёт», а о том, в какой системе вы способны развиваться. Сравните планы марта, практические шаги июня и ограничения, встреченные летом. Какие решения выдержали проверку ресурсами? Где масштаб вырос без потери управляемости? Если ответа нет, это тоже полезные данные для следующего цикла.</p><p>Повторный секстиль Нептуна к Венере в самом конце октября возвращает более мягкую линию — образы, близость, творчество и способность видеть возможности. Сверьте вдохновение с конкретикой, как делали в апреле. Для отношений это может быть разговор о будущем без обещаний, которые не готовы исполнять; для дела — черновик проекта без преждевременного бюджета. Этот отчёт не закрывает вашу историю. Он даёт карту вопросов, к которым можно вернуться.</p><div class="callout"><strong>Попробуйте на практике</strong><p>Напишите одностраничное послесловие к году: три подтверждённых изменения, два открытых вопроса, один шаг на ноябрь.</p></div><div class="quote">Что я хочу продолжить не потому, что начал, а потому, что это по-прежнему моё?</div><h3 class="cal-title">Календарь месяца</h3><div class="calendar compact"><div class="dayhead">Пн</div><div class="dayhead">Вт</div><div class="dayhead">Ср</div><div class="dayhead">Чт</div><div class="dayhead">Пт</div><div class="dayhead">Сб</div><div class="dayh h+=page(18,'premium',`<div class="eyebrow">06 · После прочтения</div><h2>Справочник и следующий шаг</h2><div class="rule"></div><div class="glossary"><div><b>Натальная карта</b><span>Положения небесных тел для времени и места рождения. В этом атласе: тропические геоцентрические долготы.</span></div><div><b>Транзит</b><span>Положение тела в выбранную дату относительно натального положения. Его точность можно рассчитать; смысл — интерпретация.</span></div><div><b>Соединение</b><span>Разница долгот близка к 0°. В главах указаны точные моменты пересечения.</span></div><div><b>Тригон · квадрат · оппозиция</b><span>Углы около 120°, 90° и 180°. Они не классифицируют день как хороший или плохой.</span></div><div><b>Ретроградность</b><span>Кажущееся обратное движение по небу при наблюдении с Земли. Поэтому одна точка может пересекаться три раза.</span></div><div><b>Асцендент и дома</b><span>Восходящий градус и сектора карты. Они чувствительны ко времени и методике; в этой версии дома не показаны без отдельной проверки.</span></div></div><div class="line"></div><h3>Вопросы к своему отчёту</h3><p>Если какая-то трактовка не совпадает с опытом, не нужно подгонять под неё жизнь. Отметьте фразу, которая вызывает вопрос, и контекст, которого не хватило. Это хорошая отправная точка для разговора.</p><div class="cta"><span class="caps">Доступно после покупки полного отчёта</span><h3>Обсудить текст с человеком</h3><p>Можно написать команде, какой абзац непонятен, и попросить объяснить метод и формулировку. Это не обещание бесплатного индивидуального прогноза или звонка: формат и цену дополнительной консультации показываем отдельно, только с согласия пользователя.</p><span class="pill">Задать вопрос по отчёту · демо</span></div><p class="footer-note">© Свой круг · демонстрационный персональный атлас для Марка. Материал не является медицинской, финансовой или иной профессиональной рекомендацией. Покупка и диалог в этом HTML не подключены.</p>`);
