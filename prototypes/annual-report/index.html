  <style>

    .brand{font:27px Cormorant,Georgia,serif;letter-spacing:.03em}.topbar small{color:#d9c7a9}.topbar a{color:#fff;text-decoration:none;border:1px solid #a88653;border-radius:30px;padding:7px 13px;font-size:11px}
    main{padding:28px 14px 50px}.page{width:210mm;height:297mm;margin:0 auto 20px;background:var(--paper);position:relative;overflow:hidden;padding:23mm 21mm 19mm;box-shadow:0 8px 35px #18263523;break-after:page;page-break-after:always}
    .page:before{content:"";position:absolute;inset:8mm;border:1px solid #e6dfd2;pointer-events:none}.page>*{position:relative}.page-no{position:absolute;bottom:11mm;right:21mm;font-size:9px;color:#8d918f;letter-spacing:.15em}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.25em;color:var(--gold);font-weight:700}.rule{width:42px;height:2px;background:var(--gold);margin:14px 0 20px}h1,h2,h3,p{margin-top:0}h1,h2,h3{font-family:Cormorant,Georgia,serif;font-weight:400;line-height:1.05}h1{font-size:64px;margin-bottom:15px}h2{font-size:43px;margin-bottom:14px}h3{font-size:28px;margin-bottom:10px}p{margin-bottom:12px}strong{font-weight:700}.lead{font-size:17px;line-height:1.58}.muted{color:var(--muted)}.tiny{font-size:10px}.caps{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}.note{border-left:2px solid var(--gold);padding:10px 16px;background:#f7f2e9;color:#4e5962}.soft{background:#f3f1eb;border:1px solid #e3ded4;border-radius:14px;padding:17px 19px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.accent{color:var(--teal)}.gold{color:var(--gold)}.section-gap{margin-top:26px}.line{height:1px;background:var(--line);margin:20px 0}
    .cover{background:var(--navy);color:#f8f1e4}.cover:before{border-color:#56677a}.cover .eyebrow{color:#dbbb84}.cover .cover-title{margin-top:25px}.cover .cover-title h1{font-size:67px}.cover .cover-title p{font-size:16px;color:#d1d8dd;max-width:340px}.cover .footer-cover{position:absolute;bottom:16mm;color:#e7d3ac;font-size:11px;letter-spacing:.15em;text-transform:uppercase}.cover .wheel{position:relative;display:block;width:124mm;margin:12mm auto 0;opacity:.9}
    .badge{display:inline-block;border:1px solid #bda579;border-radius:30px;padding:6px 12px;color:#816332;font-size:10px;text-transform:uppercase;letter-spacing:.12em}.cover .badge{color:#f1d5a0}
    .toc-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}.number{font-family:Cormorant,Georgia,serif;font-size:36px;color:#aa8b56}.scope{display:flex;gap:12px;align-items:flex-start}.scope .number{width:40px;flex:none}
    .chart-wrap{display:flex;justify-content:center;margin:18px 0}.chart-svg{width:132mm;max-width:100%;height:auto}.big-trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}.trio{padding:17px;border:1px solid var(--line);border-radius:12px}.trio .symbol{font:36px Cormorant,Georgia,serif;color:var(--gold)}.trio b{display:block;margin:4px 0 8px}.trio p{font-size:11px;margin:0}
    .quarter{padding:15px 18px;border-left:3px solid var(--teal);background:#f1f3ef;margin-bottom:10px}.quarter b{display:block;font-size:14px;margin-bottom:3px}.overview-list{margin:0;padding-left:18px}.overview-list li{margin:0 0 12px}
    .heatmap{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin:22px 0 10px}.heatmap div{text-align:center}.heatmap span{display:block;height:23px;border-radius:5px;margin-bottom:4px}.heatmap small{font-size:8px;color:#617077}.legend{display:flex;gap:12px;font-size:9px;color:var(--muted)}.legend i{width:12px;height:12px;display:inline-block;border-radius:3px;margin-right:4px;vertical-align:-2px}
    .monthhead{display:flex;justify-content:space-between;align-items:start}.monthnum{font:80px/.8 Cormorant,Georgia,serif;color:#d9caaa}.month-intro{font-size:15px;line-height:1.52}.topic{display:inline-block;border-bottom:1px solid var(--gold);color:#906f3d;font-size:10px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px}.quote{font:italic 28px/1.1 Cormorant,Georgia,serif;color:#365a67;padding:8px 0 10px 18px;border-left:2px solid var(--teal);margin:20px 0}.insight{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.insight>div{background:#f3f2ed;border-radius:10px;padding:12px 14px;font-size:11px}.calendar{margin-top:17px}.cal-head{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:8px}.cal-head strong{font-size:12px}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{border:1px solid #e4e0d8;border-radius:4px;height:25px;text-align:center;line-height:23px;font-size:9px}.day.key{background:#e4efeb;border-color:#a0c4be;color:#376c68}.day.pause{background:#f8eadc;border-color:#d7b992;color:#87633c}.cal-labels{display:flex;gap:12px;margin-top:7px;font-size:9px;color:var(--muted)}.cal-labels span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:#a0c4be;margin-right:4px}.cal-labels span:last-child:before{background:#d7b992}
    .month-page .page-no{bottom:10mm}.month-page .note{margin-top:13px;font-size:10px}.month-page .rule{margin:11px 0 13px}.month-page p{font-size:11.1px;line-height:1.47;margin-bottom:10px}
    .glossary{display:grid;grid-template-columns:1fr 1fr;gap:14px 22px}.glossary dt{font-weight:700;color:#355b68}.glossary dd{margin:3px 0 0;color:#53606a}.cta{background:var(--navy);color:#fff;border-radius:14px;padding:20px;margin-top:23px}.cta p{color:#d4dce0}.cta .badge{color:#e8c796}
    @media(max-width:820px){.topbar{padding:9px 13px}.topbar small{display:none}main{padding:0 0 30px}.page{width:100%;height:auto;min-height:100vh;margin:0 0 8px;padding:46px 24px 60px;box-shadow:none}.page:before{inset:12px}.cover .cover-title{margin-top:40px}.cover .cover-title h1{font-size:58px}.cover .wheel{position:relative;right:auto;bottom:auto;width:110%;margin:40px -5% 0}.cover .footer-cover{position:relative;bottom:auto;margin-top:20px}.grid3,.big-trio{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.monthnum{font-size:62px}.page-no{bottom:20px!important}.month-page p{font-size:13px;line-height:1.58}.month-page .note{font-size:11px}.cal-grid{gap:3px}.day{height:30px;line-height:28px}}
    @media print{@page{size:A4;margin:0}body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}.topbar{display:none}main{padding:0}.page{margin:0;padding:23mm 21mm 19mm;box-shadow:none;width:210mm;height:297mm;min-height:0;break-after:page;page-break-after:always}.cover .wheel{width:124mm;margin:12mm auto 0}.cover .cover-title{margin-top:25px}.cover .cover-title h1{font-size:67px}.grid3,.big-trio{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr 1fr}.page:last-child{break-after:auto}}

<body>
<div class="topbar"><div class="brand">Свой круг <small>· образец годового отчёта</small></div><a href="#contents">К содержанию ↓</a></div>
<main id="report"></main>
<script>
const months=[
 {name:'Ноябрь',theme:'Ревизия маршрута',area:'Работа и направление',intro:'Этот раздел показывает, как будет выглядеть подробная глава: сначала контекст месяца, затем возможный сценарий, точки внимания и небольшой календарь.',body:['В рабочей версии здесь появится связка рассчитанных транзитов с вашей натальной картой. Вместо абстрактного «вас ждут перемены» читатель получит объяснение: какая тема активируется, в какой сфере жизни она проявляется и почему именно в этом временном окне.','Для примера представим месяц, в котором старые обязательства требуют пересмотра. Главный вопрос не в том, чтобы немедленно отказаться от них, а в том, где вы продолжаете тратить силы по инерции. Список незавершённых обещаний полезнее грандиозного нового плана.'],action:'Разделить действующие проекты на «оставить», «переговорить» и «закрыть».',question:'Что я поддерживаю только потому, что однажды уже начал?',quote:'Хороший маршрут начинается не с ускорения, а с ясности.'},
 {name:'Декабрь',theme:'Разговор о границах',area:'Отношения и договорённости',intro:'Фокус месяца — не количество контактов, а точность ожиданий между вами и другими людьми.',body:['Полноценный прогноз должен объяснять, откуда возникает тема отношений: через конкретную конфигурацию карты, а не через общую фразу про любовь. В этом демонстрационном варианте показана форма такого объяснения без выдуманного расчёта.','Если разговор давно откладывался, устойчивее начинать с наблюдаемых фактов: что было обещано, что выполнено, что осталось неопределённым. Прогноз не решает за человека, сохранять связь или выходить из неё, но может предложить вопросы для прояснения.'],action:'Назначить один разговор, где цель — договориться о правилах, а не выиграть спор.',question:'Какое ожидание я считаю очевидным, хотя никогда не произносил?',quote:'Близость выдерживает прямой вопрос лучше, чем молчаливую проверку.'},
 {name:'Январь',theme:'Новый масштаб',area:'Цели и ресурсы',intro:'Здесь годовая линия раскладывается на практические решения: приоритеты, сроки и цену каждого выбора.',body:['В хорошем отчёте период роста не должен автоматически означать «обязательно получите деньги». Мы покажем и возможности, и цену расширения: время, внимание, навыки, помощь других людей.','Для демо рассматриваем ситуацию, когда вариантов больше, чем реальной ёмкости. Сначала выбирают один главный проект на квартал; потом определяют, какие действия действительно приближают результат. Выбранная цель становится мерилом входящих предложений.'],action:'Записать одну цель на 90 дней и три измеримых признака продвижения.',question:'Какое «интересно» мешает моему главному «важно»?',quote:'Расширение ценно только там, где у него есть опора.'},
 {name:'Февраль',theme:'Поддержка ритма',area:'Повседневность и энергия',intro:'Месячная глава соединяет тему периода с повторяющимися привычками, а не обещает чудесный день.',body:['В финальной версии ритм месяца строится по проверенным астрономическим датам и применимой школе интерпретации. Здесь мы показываем, как эта информация станет понятной читателю: краткая тема, затем практическое следствие.','Когда график плотный, решающим оказывается не героическое усилие, а обратимость нагрузки. Запас времени, возможность переноса и честный разговор о сроках создают пространство для качества. Этот блок не является медицинским советом.'],action:'Оставить в календаре два незанятых окна и заранее определить, что можно перенести.',question:'Где я путаю занятость с продвижением?',quote:'Устойчивый темп заметнее громкого старта.'},
 {name:'Март',theme:'Точка видимости',area:'Самовыражение и работа',intro:'Раздел об инициативе: когда показать идею, как получить обратную связь и не ждать идеальной версии.',body:['Задача прогноза — не подталкивать к рискованному решению одним красивым лозунгом. Он должен помочь увидеть контекст: какой импульс усиливается, где он может быть полезен и где нужна проверка реальностью.','Представьте период, когда ваши предложения замечают чаще. Тогда важно не только выступить, но и подготовить следующий шаг: кому отправить материал, что показать в цифрах, какое решение попросить принять. Видимость без ясного запроса быстро рассеивается.'],action:'Подготовить короткое описание одного проекта и запросить предметную обратную связь.',question:'Что я готов показать уже сейчас, не дожидаясь идеала?',quote:'Быть замеченным — начало разговора, не его финал.'},
 {name:'Апрель',theme:'Проверка обязательств',area:'Деньги и договоры',intro:'В этой главе важны конкретные условия, ограничения и то, что стоит перепроверить.',body:['Платный текст не должен превращать астрологическую интерпретацию в финансовую рекомендацию. Мы можем обозначить период для внимательного пересмотра договоров, но не говорить «инвестируйте» или «обязательно покупайте».','Демонстрационный сюжет месяца: накапливаются небольшие условия, которые раньше казались несущественными. Полезно перечитать сроки, обязательства и правила отмены. Если решение имеет финансовые последствия, его стоит сверить с документами и профильным специалистом.'],action:'Собрать в один список платежи и договорённости с повторяющимися сроками.',question:'Какой пункт я согласовал на словах, но не проверил в документе?',quote:'Точность бережёт свободу будущих решений.'},
 {name:'Май',theme:'Живой контакт',area:'Партнёрства и окружение',intro:'Здесь отчёт рассматривает не «процент совместимости», а реальную динамику взаимодействия.',body:['Зрелая персонализация показывает две стороны периода: где контакт поддерживает вас и где вы незаметно берёте на себя больше, чем хотели. Для утверждений о другом человеке нужен его собственный ввод и согласие; карта пользователя сама по себе их не раскрывает.','В демонстрационном тексте месяц предлагает вернуться к людям, с которыми возможна взаимная помощь. Небольшой совместный проект или честный обмен опытом дадут больше, чем попытка поддерживать десятки поверхностных связей.'],action:'Написать человеку, с которым хотите восстановить предметный контакт.',question:'Где я пытаюсь угадать чужие желания вместо того, чтобы спросить?',quote:'Связь укрепляется там, где обе стороны могут быть ясными.'},
 {name:'Июнь',theme:'Коррекция курса',area:'Обучение и планы',intro:'Половина пути — повод сравнить ожидания с наблюдаемыми результатами.',body:['В полноценном разборе это место связывает месячный период с темами из первой половины года. Такой повтор делает отчёт цельным: читатель видит развитие истории, а не двенадцать несвязанных карточек.','Если путь оказался сложнее, чем казалось, корректировка не означает поражение. Отделите цель от способа её достижения. Возможно, менять нужно срок, партнёра или формат, сохраняя саму ценность, ради которой вы начали.'],action:'Сверить январский план с фактами и переписать один следующий шаг.',question:'Что стало понятнее за шесть месяцев, хотя в январе я этого не видел?',quote:'План хорош, когда он выдерживает встречу с реальностью.'},
 {name:'Июль',theme:'Личное пространство',area:'Дом и восстановление',intro:'Месяц о среде, в которой можно думать, чувствовать и принимать решения без лишнего шума.',body:['Смысл этого блока не в том, что «звёзды заставят сидеть дома». Интерпретация лишь задаёт тему для наблюдения. Читателю нужны конкретные вопросы и мягкие практики, а не запреты на жизнь.','В примере полезно заметить, какие условия возвращают ощущение опоры: место, расписание, договорённости с близкими. Иногда небольшое изменение повседневной среды эффективнее масштабного побега от усталости.'],action:'Убрать один постоянный источник бытового напряжения.',question:'Где мне действительно спокойно, а где я лишь привык терпеть?',quote:'У пространства тоже есть свой голос.'},
 {name:'Август',theme:'Смелость выбора',area:'Инициатива и самовыражение',intro:'В этой главе появится напряжение между желанием проявиться и страхом последствий.',body:['Хороший отчёт не ставит знак равенства между «удачным окном» и гарантированным успехом. Он объясняет, почему в указанный период определённые темы могут ощущаться сильнее, и предлагает способ проверить идею небольшим обратимым шагом.','Демо-сценарий: вы давно держите предложение при себе. Вместо публичного запуска на широкую аудиторию можно начать с пилота на нескольких людях и заранее решить, какую обратную связь считать полезной.'],action:'Провести маленький тест идеи и записать, что узнали.',question:'Какой риск можно уменьшить, не отказываясь от самой идеи?',quote:'Смелость бывает размером в один проверяемый шаг.'},
 {name:'Сентябрь',theme:'Сбор результатов',area:'Работа и материальная опора',intro:'Месяц для упаковки достигнутого: назвать результат, заметить вклад и подготовить следующий цикл.',body:['Здесь месячный рассказ возвращает читателя к главным темам годового прогноза. Если каждый месяц написан отдельно и не помнит начало, ощущение персонального разбора исчезает.','В демонстрации речь о том, чтобы не обесценивать сделанное только потому, что часть целей ещё впереди. Подготовьте список завершённых дел, открытых вопросов и того, что больше не нужно продолжать. Это материал для разговора о новых условиях работы.'],action:'Составить короткое портфолио результатов года.',question:'Какой вклад я перестал замечать, потому что он стал привычным?',quote:'Завершение — тоже видимый результат.'},
 {name:'Октябрь',theme:'Порог нового года',area:'Интеграция и следующий шаг',intro:'Финальная глава не обещает, что всё «сойдётся само». Она собирает найденное и помогает выбрать продолжение.',body:['В рабочем прогнозе здесь будет сопоставление начальной карты, главных транзитных периодов и ваших действий за год. Важно не притворяться, будто приложение знает, что реально произошло: можно предложить человеку отметить своё наблюдение и скорректировать трактовку.','Как демонстрационный финал, этот месяц задаёт спокойный вопрос: какие решения стали вашими, а какие остались реакцией на обстоятельства? Ответ нужен не для оценки, а чтобы следующий год начался с собственной позиции.'],action:'Выбрать три вывода года и одно намерение на следующий цикл.',question:'Что я хочу сохранить, даже если всё вокруг изменится?',quote:'Год становится вашим, когда вы видите в нём собственные решения.'}
];
function wheel(){let s='<svg viewBox="0 0 500 500" class="chart-svg wheel" xmlns="http://www.w3.org/2000/svg" aria-label="Демонстрационная схема астрологического круга"><circle cx="250" cy="250" r="224" fill="none" stroke="#bb9559" stroke-width="1.6"/><circle cx="250" cy="250" r="179" fill="none" stroke="#82949e"/><circle cx="250" cy="250" r="112" fill="none" stroke="#82949e"/>';for(let i=0;i<12;i++){let a=(i*30-90)*Math.PI/180,x1=250+112*Math.cos(a),y1=250+112*Math.sin(a),x2=250+224*Math.cos(a),y2=250+224*Math.sin(a);s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#82949e" stroke-width="1"/>`;}let z='ОВ ТЕ БЛ РА ЛЕ ДЕ ВЕ СК СТ КО ВД РЫ'.split(' ');z.forEach((g,i)=>{let a=(i*30-75)*Math.PI/180,x=250+201*Math.cos(a),y=250+201*Math.sin(a);s+=`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" fill="#c8a66d" font-family="Arial,sans-serif" font-size="16" letter-spacing="1">${g}</text>`});s+='<text x="250" y="241" text-anchor="middle" fill="#bb9559" font-size="37" font-family="Georgia">✦</text><text x="250" y="275" text-anchor="middle" fill="#83929e" font-size="10" letter-spacing="2">ДЕМО-СХЕМА</text></svg>';return s}
function page(n,cls,html){return `<section class="page ${cls||''}" id="page-${n}">${html}<div class="page-no">СВОЙ КРУГ · ${String(n).padStart(2,'0')}</div></section>`}
function demoNote(){return '<div class="note"><strong>Пример оформления, не прогноз.</strong> Положения планет, даты и выделенные дни здесь не рассчитывались. В реальном отчёте они появятся только из проверенных астрономических данных и выбранной методики трактовки.</div>'}
function monthCalendar(i){let year=i<2?2026:2027,month=(10+i)%12,first=(new Date(year,month,1).getDay()+6)%7,count=new Date(year,month+1,0).getDate();let days=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="tiny muted" style="text-align:center">${x}</div>`).join('');for(let d=0;d<first;d++)days+='<div></div>';for(let day=1;day<=count;day++){let cl=[6,13,22].includes(day)?' key':[9,18,27].includes(day)?' pause':'';days+=`<div class="day${cl}">${day}</div>`}return `<div class="calendar"><div class="cal-head"><strong>Календарь наблюдения</strong><span class="tiny muted">условные цвета • не прогноз</span></div><div class="cal-grid">${days}</div><div class="cal-labels"><span>окно для действия</span><span>окно для проверки</span></div></div>`}
let out='';
out+=page(1,'cover',`<div class="eyebrow">Персональный атлас · 12 месяцев</div><div class="cover-title"><span class="badge">Дизайн-прототип</span><h1>Год<br>в вашей<br>орбите</h1><p>Большая тройка, карта года, двенадцать подробных глав и календарь наблюдения.</p></div>${wheel()}<div class="footer-cover">Свой круг · ноябрь 2026 — октябрь 2027</div>`);
out+=page(2,'',`<div class="eyebrow" id="contents">Перед началом</div><h2>Как читать этот атлас</h2><div class="rule"></div><p class="lead">Не перечитывайте весь год за один вечер. Начните с общей карты, а затем возвращайтесь к нужной месячной главе по мере движения.</p><div class="section-gap"><div class="toc-row"><span>01 · Основа: Большая тройка и круг карты</span><span>03–04</span></div><div class="toc-row"><span>02 · Пульс года и четыре периода</span><span>05</span></div><div class="toc-row"><span>03 · Двенадцать месячных глав</span><span>06–17</span></div><div class="toc-row"><span>04 · Словарь и следующий шаг</span><span>18</span></div></div><div class="section-gap grid2"><div class="soft scope"><span class="number">1</span><p>Сначала — <strong>что рассчитано</strong>: положения небесных тел, время, часовой пояс и методика домов.</p></div><div class="soft scope"><span class="number">2</span><p>Потом — <strong>как трактуем</strong>: возможные темы и альтернативные проявления без обещания неизбежных событий.</p></div></div><div class="section-gap">${demoNote()}</div><p class="tiny muted section-gap">Этот макет нужен для обсуждения дизайна и глубины текста до внедрения в VK Mini App. Демо не подтверждает астрологическую точность.</p>`);
out+=page(3,'',`<div class="eyebrow">01 · Основа</div><h2>Ваш небесный почерк</h2><div class="rule"></div><p class="lead">Круг в начале отчёта — не картинка от нейросети. В рабочей версии это SVG, построенный из рассчитанных координат и одинаково читаемый в приложении и PDF.</p><div class="chart-wrap">${wheel()}</div><div class="grid2"><div><div class="caps">Что покажем</div><p>Знаки и градусы планет, дома, основные аспекты, место и время рождения, использованную систему домов.</p></div><div><div class="caps">Как проверим</div><p>Для контрольной даты сравним координаты и аспекты с независимым астрономическим источником до публикации.</p></div></div><div class="section-gap">${demoNote()}</div>`);
out+=page(4,'',`<div class="eyebrow">01 · Основа</div><h2>Большая тройка</h2><div class="rule"></div><p class="lead">Бесплатное знакомство с картой: Солнце, Луна и Асцендент. Здесь показан формат, но знаки не подставлены без расчёта.</p><div class="big-trio"><div class="trio"><div class="symbol">☉</div><b>Солнце</b><p>Сознательное направление: где вы проявляете волю, собираете опыт и узнаёте себя в собственных решениях.</p></div><div class="trio"><div class="symbol">☽</div><b>Луна</b><p>Эмоциональный ритм: что помогает чувствовать безопасность и как вы восстанавливаете внутреннее равновесие.</p></div><div class="trio"><div class="symbol">↗</div><b>Асцендент</b><p>Первый способ входить в мир и то, как вас считывают до близкого знакомства. Требует точного времени рождения.</p></div></div><h3>Как это будет связано с годом</h3><p>Платный отчёт не должен повторять бесплатную карточку. Он использует основу карты как контекст: какие темы года усиливают сильные стороны, где возникает напряжение и что возвращается несколько раз.</p><div class="soft section-gap"><div class="caps">Договор о точности</div><p>Если время рождения неизвестно, мы не изображаем точный Асцендент и дома. Читатель видит, какая часть разбора остаётся доступной, а какая — приблизительной.</p></div><div class="quote">Персонализация начинается с честной границы данных.</div>`);
out+=page(5,'',`<div class="eyebrow">02 · Панорама</div><h2>Ритм двенадцати месяцев</h2><div class="rule"></div><p class="lead">Сначала короткая карта года — чтобы вы понимали, как главы связаны друг с другом. Затем каждую тему можно раскрыть на собственной странице.</p><div class="heatmap">${months.map((m,i)=>`<div><span style="background:${['#dce8e4','#accdc5','#d9c39d','#88ada9'][i%4]}"></span><small>${m.name.slice(0,3)}</small></div>`).join('')}</div><div class="legend"><span><i style="background:#dce8e4"></i>наблюдать</span><span><i style="background:#88ada9"></i>действовать</span><span><i style="background:#d9c39d"></i>перепроверить</span></div><p class="tiny muted">Цвета выше показывают визуальный принцип. Они не отражают рассчитанную «удачу» или риск.</p><div class="section-gap"><div class="quarter"><b>Ноябрь — январь · Переориентация</b>Сначала расчистить обязательства, затем выбрать, чему дать больше места.</div><div class="quarter"><b>Февраль — апрель · Настройка ритма</b>Сверить планы с реальными ресурсами, договорённостями и условиями.</div><div class="quarter"><b>Май — июль · Проверка связей</b>Уточнить роли, качество поддержки и устройство повседневной жизни.</div><div class="quarter"><b>Август — октябрь · Сбор смысла</b>Протестировать новое, назвать результаты и выбрать следующий цикл.</div></div><div class="section-gap">${demoNote()}</div>`);
months.forEach((m,i)=>{let n=i+6;out+=page(n,'month-page',`<div class="monthhead"><div><div class="eyebrow">03 · Месячная глава ${String(i+1).padStart(2,'0')} / 12</div><h2>${m.name} <span class="muted">${i<2?'2026':'2027'}</span></h2></div><div class="monthnum">${String(i+1).padStart(2,'0')}</div></div><div class="rule"></div><span class="topic">${m.area}</span><h3>${m.theme}</h3><p class="month-intro">${m.intro}</p><div class="quote">${m.quote}</div>${m.body.map(x=>`<p>${x}</p>`).join('')}<div class="insight"><div><span class="caps">Практический шаг</span><br>${m.action}</div><div><span class="caps">Вопрос месяца</span><br>${m.question}</div></div>${monthCalendar(i)}<div class="note"><strong>В рабочем отчёте:</strong> здесь будут рассчитанные даты, источник каждого окна, сила и границы интерпретации. Сейчас календарь иллюстративный.</div>`)});
out+=page(18,'',`<div class="eyebrow">04 · После чтения</div><h2>Словарь и следующий шаг</h2><div class="rule"></div><p class="lead">Термины не должны заставлять вас искать объяснения вне отчёта. Каждый технический вывод связан с простым смыслом.</p><dl class="glossary"><div><dt>Натальная карта</dt><dd>Схема положения небесных тел на момент рождения с учётом места и времени.</dd></div><div><dt>Транзит</dt><dd>Положение небесного тела в выбранную дату по отношению к точкам натальной карты.</dd></div><div><dt>Аспект</dt><dd>Угловое соотношение двух точек карты, для которого задан допустимый орбис.</dd></div><div><dt>Орбис</dt><dd>Допустимое отклонение от точного угла аспекта, указанное в методике.</dd></div><div><dt>Дом</dt><dd>Один из секторов карты, зависящий от времени рождения и системы расчёта.</dd></div><div><dt>Ретроградность</dt><dd>Видимое с Земли обратное движение планеты на фоне звёзд.</dd></div></dl><div class="cta"><span class="badge">После полного отчёта</span><h3 style="margin-top:14px">Хочется обсудить написанное?</h3><p>Напишите живому практику, если какой-то фрагмент непонятен. Это приглашение к диалогу по вашему купленному отчёту; платный углублённый формат и его стоимость будут представлены отдельно, до заказа.</p><strong>Обсудить свой прогноз →</strong></div><p class="tiny muted section-gap">Астрологический отчёт — интерпретационный продукт, не медицинская, финансовая или юридическая рекомендация. Для важных решений опирайтесь на проверяемые факты и профильных специалистов.</p>`);
document.getElementById('report').innerHTML=out;
