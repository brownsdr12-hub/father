*{box-sizing:border-box}body{margin:0;background:#d9dce0;color:var(--ink);font:13px/1.55 Manrope,Arial,sans-serif}.bar{position:sticky;top:0;z-index:9;background:var(--navy);color:#fff;padding:9px 20px;display:flex;justify-content:space-between;align-items:center}.bar b{font:26px Cormorant,Georgia,serif}.bar span{font-size:11px;color:#d3d9db}main{padding:25px 12px}.page{width:210mm;height:297mm;margin:0 auto 18px;padding:22mm 20mm 18mm;background:var(--paper);position:relative;overflow:hidden;break-after:page;box-shadow:0 10px 28px #0b172828}.page:before{content:"";position:absolute;inset:8mm;border:1px solid #e3ded4;pointer-events:none}.page>*{position:relative}.num{position:absolute;bottom:10mm;right:20mm;font-size:9px;letter-spacing:.14em;color:#87929a}.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:700}.rule{height:2px;width:43px;background:var(--gold);margin:13px 0 19px}h1,h2,h3,p{margin-top:0}h1,h2,h3{font-family:Cormorant,Georgia,serif;font-weight:400;line-height:1.05}h1{font-size:68px}h2{font-size:43px;margin-bottom:12px}h3{font-size:29px;margin-bottom:10px}p{margin-bottom:11px}.lead{font-size:16px;line-height:1.56}.tiny{font-size:10px}.muted{color:var(--muted)}.caps{text-transform:uppercase;letter-spacing:.16em;font-size:9px;color:var(--muted)}.soft{background:#f2f2ed;border:1px solid #e4ded2;border-radius:13px;padding:15px 17px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}.note{background:#f7f2e8;border-left:2px solid var(--gold);padding:11px 15px}.quote{border-left:2px solid var(--teal);padding:8px 0 8px 17px;font:italic 27px/1.12 Cormorant,Georgia,serif;color:var(--blue);margin:20px 0}.line{height:1px;background:var(--line);margin:20px 0}.pill{display:inline-block;border:1px solid #c6a877;border-radius:30px;padding:6px 11px;color:#a67d42;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.cover{background:var(--navy);color:#f9f2e6}.cover:before{border-color:#526679}.cover .eyebrow{color:#d8ba83}.cover .intro{margin-top:38px}.cover h1{font-size:82px;margin-bottom:16px}.cover .lead{color:#d8e0e3;max-width:390px}.cover .orb{width:124mm;height:124mm;border:1px solid var(--gold);border-radius:50%;margin:34px auto 0;position:relative;display:grid;place-items:center}.cover .orb:before,.cover .orb:after{content:"";position:absolute;inset:13%;border:1px solid #79909b;border-radius:50%}.cover .orb:after{inset:29%}.cover .orb div{text-align:center;z-index:2}.cover .orb span{display:block;font:64px Cormorant,Georgia,serif;color:#deb878}.cover .orb small{font-size:10px;letter-spacing:.15em;color:#d8e0e3}.cover footer{position:absolute;bottom:19mm;left:20mm;font-size:10px;letter-spacing:.13em;color:#d1b784;text-transform:uppercase}

.month p{font-size:11.5px;line-height:1.48}.month .lead{font-size:15px}.month .quote{font-size:23px;margin:10px 0}.callout{padding:13px 16px;background:#e9f0ec;border-radius:12px;margin:13px 0}.callout strong{color:#346c69}.callout p{margin:5px 0 0}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:13px 0}.steps div{background:#f0f1ed;padding:10px;border-radius:9px;font-size:10px}.steps strong{display:block;color:#355c6b;margin-bottom:5px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:9px}.calendar div{text-align:center;border:1px solid #e3ded4;border-radius:5px;min-height:27px;padding:5px;font-size:10px}.calendar .dayhead{border:0;color:#80909a}.calendar .active{background:#dceae5;border-color:#8ab6a7}.calendar .review{background:#f5ead6;border-color:#d6b77d}.calendar .phase{background:#e6e6ec;border-color:#b9bccd}.legend{font-size:9px;color:var(--muted);margin-top:7px}.legend span{display:inline-block;padding-right:12px}.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;background:#8ab6a7}.legend .r i{background:#d6b77d}.legend .p i{background:#b9bccd}.footer-note{font-size:10px;color:var(--muted);border-top:1px solid var(--line);padding-top:11px;margin-top:15px}.month .footer-note{font-size:10px;line-height:1.35;padding-top:7px;margin-top:9px}

<body><div class="bar"><b>Свой круг</b><span>Пилот персонального разбора · Марк</span></div><main id="report"></main>
<script>
const positions=[['Солнце','Овен','18°44′',18.736220,'С'],['Луна','Стрелец','13°21′',253.346500,'Л'],['Меркурий','Телец','0°20′',30.326009,'Ме'],['Венера','Близнецы','4°23′',64.388505,'В'],['Марс','Овен','11°22′',11.366912,'Ма'],['Юпитер','Козерог','16°35′',286.589470,'Ю'],['Сатурн','Овен','0°07′',0.111711,'Са'],['Уран','Водолей','4°12′',304.197718,'У'],['Нептун','Козерог','27°38′',297.631741,'Н'],['Плутон','Стрелец','2°49′',242.809521,'П']];
function wheel(){let s='<svg class="wheel" viewBox="0 0 500 500" role="img" aria-label="Натальный круг Марка с вычисленными положениями планет"><circle cx="250" cy="250" r="224" fill="none" stroke="#bb9153" stroke-width="1.6"/><circle cx="250" cy="250" r="183" fill="none" stroke="#82949e"/><circle cx="250" cy="250" r="116" fill="none" stroke="#82949e"/>';for(let i=0;i<12;i++){let a=(i*30-90)*Math.PI/180;s+=`<line x1="${250+116*Math.cos(a)}" y1="${250+116*Math.sin(a)}" x2="${250+224*Math.cos(a)}" y2="${250+224*Math.sin(a)}" stroke="#9baab0"/>`;}let signs='ОВ ТЕ БЛ РА ЛЕ ДЕ ВЕ СК СТ КО ВД РЫ'.split(' ');signs.forEach((x,i)=>{let a=(i*30-75)*Math.PI/180;s+=`<text x="${250+204*Math.cos(a)}" y="${250+204*Math.sin(a)}" text-anchor="middle" dominant-baseline="middle" fill="#ac8650" font-size="16" font-family="Arial">${x}</text>`});positions.forEach((x,i)=>{let a=(x[3]-90)*Math.PI/180;let r= i===0||i===1||i===3?148:137;let px=250+r*Math.cos(a),py=250+r*Math.sin(a);s+=`<circle cx="${px}" cy="${py}" r="11" fill="${[0,1,3].includes(i)?'#355c6b':'#eee9df'}" stroke="#bb9153"/><text x="${px}" y="${py+3.6}" text-anchor="middle" fill="${[0,1,3].includes(i)?'#fff':'#355c6b'}" font-size="9" font-family="Arial">${x[4]}</text>`});s+='<text x="250" y="242" text-anchor="middle" font-size="30" font-family="Georgia" fill="#355c6b">Марк</text><text x="250" y="265" text-anchor="middle" font-size="11" font-family="Arial" fill="#87929a">08.04.1996 · 07:13 UTC</text></svg>';return s}
function page(n,cls,content){return `<section class="page ${cls||''}">${content}<div class="num">СВОЙ КРУГ · ${String(n).padStart(2,'0')}</div></section>`}
let h='';
h+=page(1,'cover',`<div class="eyebrow">Персональный атлас · пилот</div><div class="intro"><span class="pill">Реальные астрономические положения</span><h1>Марк,<br>ваш год<br>в орбите</h1><p class="lead">Первый проверочный выпуск: ваша карта рождения и подробный разбор ноября 2026 года.</p></div><div class="orb"><div><span>✦</span><small>08 АПРЕЛЯ 1996<br>ЧЕРЕПОВЕЦ · 11:13</small></div></div><footer>Ноябрь 2026 — октябрь 2027 · пока готова первая глава</footer>`);
h+=page(2,'',`<div class="eyebrow">01 · Исходные данные</div><h2>Карта рождения</h2><div class="rule"></div><p class="lead">Место рождения: Череповец (59.1269° с. ш., 37.9092° в. д.). 8 апреля 1996 года действовало летнее время UTC+4, поэтому 11:13 на местных часах — это 07:13 UTC.</p><div class="data"><div><small>Солнце</small><strong>Овен</strong><small>18°44′</small></div><div><small>Луна</small><strong>Стрелец</strong><small>13°21′</small></div><div><small>Асцендент*</small><strong>Рак</strong><small>≈ 22°33′</small></div></div>${wheel()}<div class="positions">${positions.map(x=>`<div><b>${x[0]}</b><span>${x[2]} ${x[1]}</span></div>`).join('')}</div><p class="footer-note">* Асцендент пока рассчитан отдельно по сидерическому времени и требует независимой проверки с выбранной системой домов. Планеты рассчитаны по тропической геоцентрической долготе; округление до минуты дуги.</p>`);
h+=page(3,'',`<div class="eyebrow">02 · Главная нить года</div><h2>Три касания к одной теме</h2><div class="rule"></div><p class="lead">В вашей карте Венера стоит около 4°23′ Близнецов. В 2026–2027 годах Уран проходит эту точку трижды — прямым ходом, обратным и снова прямым. Для годового отчёта это гораздо содержательнее случайной фразы «перемены в любви».</p><div class="arc"><div><small>Первое касание</small><strong>15 июля<br>2026</strong><p>Знакомство с темой. Что в отношениях, творчестве или способе обмена уже перестало устраивать?</p></div><div><small>Повторный проход</small><strong>8 ноября<br>2026</strong><p>Ноябрь возвращает вопрос. Можно отделить временное раздражение от устойчивой потребности изменить правила.</p></div><div><small>Третье касание</small><strong>3 мая<br>2027</strong><p>Возможность сравнить намерения с практикой и выбрать форму, которую действительно хочется сохранить.</p></div></div><div class="note"><strong>Это трактовка, а не предсказание события.</strong> Венера в западной астрологии связана с ценностями, симпатиями и обменом; Уран — с обновлением и свободой. Точное соединение говорит лишь о совпадении долгот, а не гарантирует знакомство, разрыв или прибыль.</div><h3 style="margin-top:27px">На чём основан ноябрь</h3><div class="basis"><b>1 ноября</b><span>Транзитный Марс образует тригон к вашему Солнцу (точный аспект около 08:28 по Москве).</span></div><div class="basis"><b>8 ноября</b><span>Транзитный Уран повторно соединяется с вашей Венерой (около 16:59 по Москве).</span></div><div class="basis"><b>22 ноября</b><span>Транзитное Солнце образует тригон к вашему Сатурну (около 13:03 по Москве).</span></div><p class="footer-note">Время аспектов округлено до минуты. Без подтверждённой системы домов мы не приписываем этим аспектам конкретную сферу жизни как астрономический факт.</p>`);
h+=page(4,'month',`<div class="eyebrow">03 · Месячная глава 01 / 12</div><h2>Ноябрь 2026</h2><div class="rule"></div><span class="pill">Ключевая тема: обновить условия</span><h3 style="margin-top:19px">Свобода без разрыва с ценным</h3><p class="lead">Марк, ноябрь не выглядит как изолированный эпизод. Это второй проход Урана по вашей натальной Венере: вопрос, который мог обозначиться летом, возвращается в более конкретной форме.</p><div class="quote">Не обязательно менять людей. Иногда достаточно изменить правила, по которым вы с ними взаимодействуете.</div><p>В интерпретации западной астрологии Венера описывает то, что кажется привлекательным и ценным, а также способ вступать в обмен. В Близнецах эта тема часто читается через разговор, идеи, любопытство и возможность выбора. Уран символически добавляет потребность в свободе и непривычном формате. Поэтому ноябрьская гипотеза — не «судьба преподнесёт знакомство», а проверка: где вам уже тесно в привычных договорённостях?</p><p>Это может касаться личной связи, совместного проекта, финансовых условий или того, как вы распоряжаетесь своим временем. Карта сама по себе не сообщает, какая из этих сфер сейчас главная. Полезнее сверить трактовку с фактами: какие разговоры повторяются с июля, где вам предлагают старую роль, от которой вы внутренне отошли, и чего вы хотите взамен.</p><div class="callout"><strong>1–3 ноября · импульс к действию</strong><p>Тригон Марса к вашему Солнцу — краткое окно, которое в рамках выбранной методики можно прочитать как поддержку инициативы. Предложите конкретный первый шаг, но не превращайте один день в обещание успеха. Выигрышнее пилот, встреча или черновик решения, чем обязательство без права пересмотра.</p></div><p>Особенность месяца — сочетание быстрого импульса в начале и более долгой темы Урана–Венеры. Если 1 ноября захочется немедленно всё переделать, оставьте себе время на проверку. Сформулируйте, какая потребность стоит за этим желанием: больше самостоятельности, яснее условия, другой темп, интерес к новой форме сотрудничества? Названная потребность уже даёт направление разговору.</p><p>Середина месяца лучше подходит не для гадания о чужих намерениях, а для прямого уточнения ожиданий. Спросите, что другая сторона действительно готова изменить. Не обещайте отказ от важных для себя вещей только ради того, чтобы быстро снять напряжение.</p><p class="footer-note">Личные, карьерные и финансовые примеры выше — варианты проявления символической темы, а не предсказанные события. Для решений с материальными последствиями нужны факты, документы и профильная консультация.</p>`);
h+=page(5,'month',`<div class="eyebrow">03 · Месячная глава · продолжение</div><h2>Календарь ноября</h2><div class="rule"></div><p class="lead">Вместо шкалы «удачи» — проверяемые астрономические события и связанные с вашей картой аспекты. Подсветка показывает, почему день попал в отчёт, а не обещает результат.</p><div class="calendar" id="calendar"></div><div class="legend"><span><i></i>личный аспект</span><span class="r"><i></i>точка пересмотра</span><span class="p"><i></i>фаза Луны, не персональная</span></div><div class="grid2" style="margin-top:18px"><div class="soft"><span class="caps">8 ноября · главный личный маркер</span><p><strong>Уран соединяется с натальной Венерой.</strong> Можно вернуться к вопросу июля: что изменилось в ваших отношениях с людьми, деньгами, временем или творческими идеями? Полезно записать наблюдения до разговора, чтобы не выдать минутный импульс за окончательное решение.</p></div><div class="soft"><span class="caps">9 и 24 ноября · лунный слой</span><p><strong>Новолуние и полнолуние</strong> рассчитаны для всех жителей Земли одинаково по моменту времени. Они дают ритм календарю, но сами по себе не делают дни лично «удачными» для вас.</p></div></div><div class="callout"><strong>22 ноября · собрать договорённость</strong><p>Краткий тригон Солнца к вашему Сатурну символически подходит для оформления решения: не только почувствовать, что хочется перемен, но и прописать условия, сроки и критерий проверки. Этот аспект не заменяет реальный план.</p></div><h3>Небольшая практика месяца</h3><div class="steps"><div><strong>1 · Что ценно?</strong>Назовите связь, проект или условие, которое хотите сохранить.</div><div><strong>2 · Что устарело?</strong>Сформулируйте правило, которое больше не работает.</div><div><strong>3 · Что пробуем?</strong>Предложите изменение с понятным сроком пересмотра.</div></div><div class="quote">Какую свободу я могу попросить прямо, не разрушая то, что мне дорого?</div><p class="footer-note">Метод пилота: тропический зодиак; геоцентрические видимые долготы Astronomy Engine; мажорные аспекты по точному углу; локальное время событий — Москва, UTC+3. Расчёты не доказывают прогностическую силу трактовок.</p>`);
document.getElementById('report').innerHTML=h;
let c='<div class="dayhead">Пн</div><div class="dayhead">Вт</div><div class="dayhead">Ср</div><div class="dayhead">Чт</div><div class="dayhead">Пт</div><div class="dayhead">Сб</div><div class="dayhead">Вс</div>';for(let i=0;i<6;i++)c+='<div style="border:0"></div>';for(let d=1;d<=30;d++){let cls=[1,22].includes(d)?'active':d===8?'review':[9,24].includes(d)?'phase':'';c+=`<div class="${cls}">${d}</div>`}document.getElementById('calendar').innerHTML=c;
</script></body></html>
